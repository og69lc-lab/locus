        run: |
          python3 - <<'PYTHON'
          import base64, os, tarfile, io
          decoded=base64.b64decode(''.join(os.environ['FREE_FLIGHT_PACKAGE_B64'].split()))
          with tarfile.open(fileobj=io.BytesIO(decoded), mode='r:gz') as package:
              safe={'Locus/Features/Routes/FreeLiveFlights.swift', 'scripts/add_free_real_flights.py'}
              assert {m.name for m in package.getmembers()} == safe
              package.extractall('.', filter='data')
          PYTHON
          python3 scripts/add_free_real_flights.py
          test -f Locus/Features/Routes/FreeLiveFlights.swift
          test -f FREE-REAL-FLIGHTS.md

      - name: Commit integrated upgrade without altering previous branches
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Locus/Engine/SpoofSession.swift \
                  Locus/Features/Routes/RoutePlannerSheet.swift \
                  Locus/Features/Routes/FreeLiveFlights.swift \
                  scripts/add_free_real_flights.py FREE-REAL-FLIGHTS.md
          git diff --cached --quiet || git commit -m 'Add free real aircraft tracking, OSM airport maps and optional free flight boards'
          git push origin HEAD:refs/heads/feature/free-live-flight-pro

      - name: Build instructions
        run: |
          echo 'Upgrade branch created: feature/free-live-flight-pro'
          echo 'In Codemagic select branch feature/free-live-flight-pro'
          echo 'Choose workflow: Locus Travel Modes - Unsigned IPA'
          echo 'No API key needed for live tracking or OpenStreetMap airport ground maps.'
          echo 'SkyLink flight boards optionally need your own free-tier key.'
