      - name: Commit every feature in one upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Locus/Features/Routes/AirportIntelligence.swift \
                  scripts/add-airport-intelligence.py \
                  Locus/Features/Routes/RoutePlannerSheet.swift \
                  Locus/Features/Map/MapHomeView.swift \
                  Locus/Engine/SpoofSession.swift \
                  project.yml AIRPORT-INTELLIGENCE.md
          git diff --cached --quiet || git commit -m 'Add all-in-one Airport Intelligence and flight journey planner'
          git push --force-with-lease origin HEAD:refs/heads/feature/airport-intelligence-all-in-one
      - name: Display instructions
        run: |
          echo 'Airport Intelligence branch: feature/airport-intelligence-all-in-one'
          echo 'In Codemagic select this branch and Locus Travel Modes - Unsigned IPA.'
