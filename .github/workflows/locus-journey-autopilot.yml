name: Locus Journey Autopilot - One Click

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out existing live-flight and airport upgrades
        uses: actions/checkout@v4
        with:
          ref: 9bd00b07c5db2ece8db7ebaf14fed578903912b8
          fetch-depth: 0
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Apply Journey Autopilot upgrade
        run: |
          python3 - <<'PYTHON_INSTALLER'
          from pathlib import Path
          import json

          def replace(s, old, new):
              if s.count(old) != 1:
                  raise RuntimeError(f"Expected one anchor, found {s.count(old)}: {old!r}")
              return s.replace(old,new,1)

          parts = {'model.swift': '\n// MARK: - Journey Autopilot (local scheduled simulation)\nstruct JourneyPoint: Codable {\n    let latitude: Double\n    let longitude: Double\n    var valid: Bool { latitude.isFinite && longitude.isFinite && abs(latitude) <= 90 && abs(longitude) <= 180 }\n    func distance(to b: Self) -> Double {\n        let a1 = latitude * .pi / 180, b1 = b.latitude * .pi / 180\n        let d = (b.longitude - longitude) * .pi / 180\n        let h = pow(sin((b1-a1)/2),2) + cos(a1)*cos(b1)*pow(sin(d/2),2)\n        return 6371000 * 2 * asin(sqrt(min(1,max(0,h))))\n    }\n    func interpolate(to b: Self, fraction f: Double) -> Self {\n        if f <= 0 { return self }; if f >= 1 { return b }\n        let a1 = latitude * .pi / 180, b1 = b.latitude * .pi / 180\n        let d = (b.longitude - longitude) * .pi / 180\n        let bearing = atan2(sin(d)*cos(b1),cos(a1)*sin(b1)-sin(a1)*cos(b1)*cos(d))\n        let angle = distance(to:b) * f / 6371000\n        let lat = asin(min(1,max(-1,sin(a1)*cos(angle)+cos(a1)*sin(angle)*cos(bearing))))\n        let lon = longitude * .pi / 180 + atan2(sin(bearing)*sin(angle)*cos(a1),cos(angle)-sin(a1)*sin(lat))\n        return Self(latitude:lat*180 / .pi,longitude:(lon*180 / .pi+540).truncatingRemainder(dividingBy:360)-180)\n    }\n}\nstruct JourneyLeg: Codable, Identifiable {\n    let title: String\n    let mode: String\n    let start: Date\n    let end: Date\n    let timeZone: String?\n    let notes: String?\n    let points: [JourneyPoint]\n    var id: Date { start }\n    var zone: TimeZone { timeZone.flatMap { TimeZone(identifier:$0) } ?? .current }\n}\nenum JourneyError: LocalizedError {\n    case invalid(String)\n    var errorDescription: String? { switch self { case .invalid(let message): return message } }\n}\nstruct JourneyPlan: Codable {\n    let version: Int\n    let title: String\n    let legs: [JourneyLeg]\n    static let storageKey = "locus.journey.plan.v1"\n    static let maxBytes = 2_000_000\n    static func decode(_ data: Data) throws -> Self {\n        guard data.count <= maxBytes else { throw JourneyError.invalid("File exceeds 2 MB.") }\n        let decoder = JSONDecoder(); decoder.dateDecodingStrategy = .iso8601\n        let plan = try decoder.decode(Self.self,from:data); try plan.validate(); return plan\n    }\n    func validate() throws {\n        guard version == 1, !title.isEmpty, let first = legs.first, let last = legs.last,\n              legs.count <= 10000, last.end.timeIntervalSince(first.start) <= 366*86400 else {\n            throw JourneyError.invalid("Expected version 1 and 1–10,000 activities spanning no more than 366 days.")\n        }\n        let modes = Set(["stay","walk","run","cycle","drive","flight","ship","train"])\n        var prev: JourneyLeg?; var count = 0\n        for leg in legs {\n            count += leg.points.count\n            guard count <= 100000, !leg.title.isEmpty, modes.contains(leg.mode), leg.end > leg.start,\n                  leg.points.allSatisfy(\\.valid), (leg.mode == "stay" ? leg.points.count == 1 : leg.points.count >= 2),\n                  leg.timeZone == nil || TimeZone(identifier:leg.timeZone!) != nil else {\n                throw JourneyError.invalid("Invalid activity: \\(leg.title)")\n            }\n            if let prev {\n                guard leg.start == prev.end, prev.points.last!.distance(to:leg.points.first!) <= 1 else {\n                    throw JourneyError.invalid("Gap, overlap or disconnected coordinates before \\(leg.title).")\n                }\n            }\n            prev = leg\n        }\n    }\n}\nstruct JourneyTrack {\n    let points: [JourneyPoint]\n    let cumulative: [Double]\n    init(_ leg: JourneyLeg) {\n        points = leg.points\n        var c = [0.0]\n        for i in leg.points.indices.dropFirst() { c.append(c[i-1] + leg.points[i-1].distance(to:leg.points[i])) }\n        cumulative = c\n    }\n    func sample(_ f: Double) -> JourneyPoint {\n        guard points.count > 1, let total = cumulative.last, total > 0 else { return points[0] }\n        if f <= 0 { return points[0] }; if f >= 1 { return points[points.count-1] }\n        let target = total*f\n        var lo = 1, hi = points.count-1\n        while lo < hi { let m = (lo+hi)/2; if cumulative[m] < target { lo = m+1 } else { hi = m } }\n        let length = cumulative[lo]-cumulative[lo-1]\n        guard length > 0 else { return points[lo] }\n        return points[lo-1].interpolate(to:points[lo],fraction:(target-cumulative[lo-1])/length)\n    }\n}\nstruct JourneyFrame {\n    let point: JourneyPoint\n    let label: String\n    let finished: Bool\n}\nstruct JourneySchedule {\n    let plan: JourneyPlan\n    private let tracks: [JourneyTrack]\n    init(_ plan: JourneyPlan) throws { try plan.validate(); self.plan = plan; tracks = plan.legs.map(JourneyTrack.init) }\n    func frame(at date: Date) -> JourneyFrame {\n        let legs = plan.legs, last = plan.legs.count-1\n        if date < legs[0].start { return JourneyFrame(point:tracks[0].sample(0),label:"Waiting for start",finished:false) }\n        if date >= legs[last].end { return JourneyFrame(point:tracks[last].sample(1),label:"Journey complete",finished:true) }\n        var lo = 0, hi = last\n        while lo < hi { let m = (lo+hi)/2; if legs[m].end <= date { lo = m+1 } else { hi = m } }\n        let leg = legs[lo]\n        return JourneyFrame(point:tracks[lo].sample(date.timeIntervalSince(leg.start)/leg.end.timeIntervalSince(leg.start)),label:leg.title,finished:false)\n    }\n}\n', 'session.txt': '    @Published private(set) var journeyPlan: JourneyPlan?\n    @Published private(set) var journeyEnabled = false\n    @Published private(set) var journeyPaused = false\n    @Published private(set) var journeyActivity = ""\n    private var journeySchedule: JourneySchedule?\n\n    func importJourney(_ data: Data) throws {\n        guard !journeyEnabled else { throw JourneyError.invalid("Stop the current journey first.") }\n        let plan = try JourneyPlan.decode(data)\n        UserDefaults.standard.set(data,forKey:JourneyPlan.storageKey)\n        journeyPlan = plan; journeyActivity = "Ready"\n    }\n    func startJourney(pairing: PairingStore) {\n        guard let plan = journeyPlan, let schedule = try? JourneySchedule(plan) else { return }\n        guard pairing.hasPairingFile else { lastError = "Import an RPPairing file first."; return }\n        guard !schedule.frame(at:Date()).finished else { lastError = "Journey ended. Import a plan with new dates."; return }\n        cancelMovement()\n        journeySchedule = schedule; journeyEnabled = true; journeyPaused = false\n        driftOffset = (0,0); variation = MotionVariation()\n        journeyActivity = "Connecting…"\n        startAfterResolving { [self] in\n            guard journeyEnabled else { return }\n            let frame = schedule.frame(at:Date())\n            if frame.finished { clearJourneyMovement(); journeyActivity = "Journey complete"; return }\n            apply(CLLocationCoordinate2D(latitude:frame.point.latitude,longitude:frame.point.longitude),pairing:pairing,markRecent:false)\n            journeyActivity = status == .active ? frame.label : "Connection failed — resume to retry"\n        }\n    }\n    func pauseJourney() {\n        guard journeyEnabled, status == .active else { return }\n        journeyPaused = true; journeyActivity = "Paused — clock continues"\n    }\n    func resumeJourney(pairing: PairingStore) {\n        if journeyEnabled && status == .active { journeyPaused = false; journeyActivity = "Resuming…" }\n        else { startJourney(pairing:pairing) }\n    }\n    private func clearJourneyMovement() {\n        journeySchedule = nil; journeyEnabled = false; journeyPaused = false; journeyActivity = ""\n    }\n\n', 'tick.txt': '        if journeyEnabled, let schedule = journeySchedule {\n            guard !journeyPaused else { return }\n            let frame = schedule.frame(at:Date())\n            if frame.finished {\n                stop(pairing:pairing)\n                journeyActivity = "Journey complete — simulation stopped"\n                return\n            }\n            if journeyActivity != frame.label { journeyActivity = frame.label }\n            driftOffset = (0,0)\n            let current = JourneyPoint(latitude:ideal.latitude,longitude:ideal.longitude)\n            if current.distance(to:frame.point) > 0.2 {\n                apply(CLLocationCoordinate2D(latitude:frame.point.latitude,longitude:frame.point.longitude),pairing:pairing,markRecent:false)\n            }\n            return\n        }\n', 'view.swift': '\nstruct JourneyAutopilotView: View {\n    @EnvironmentObject private var session: SpoofSession\n    @EnvironmentObject private var pairing: PairingStore\n    @Environment(\\.dismiss) private var dismiss\n    @State private var importing = false\n    @State private var error: String?\n    var body: some View {\n        NavigationStack {\n            List {\n                Section("Import") {\n                    Text("Scheduled GPS simulation. Import a planned itinerary, not an observed travel record.").font(.footnote).foregroundStyle(.secondary)\n                    Button("Import Journey JSON") { importing = true }.disabled(session.journeyEnabled)\n                    Button("Paste Journey JSON") {\n                        guard let text = UIPasteboard.general.string else { error = "Clipboard is empty."; return }\n                        load(Data(text.utf8))\n                    }.disabled(session.journeyEnabled)\n                }\n                if let plan = session.journeyPlan {\n                    Section("Journey") {\n                        Text(plan.title).font(.headline)\n                        Text("\\(plan.legs.count) activities · \\(session.status.label)")\n                        Text(session.journeyActivity.isEmpty ? "Ready" : session.journeyActivity).foregroundStyle(.secondary)\n                        if session.journeyEnabled {\n                            if session.journeyPaused || session.status != .active {\n                                Button("Resume at scheduled time") { session.resumeJourney(pairing:pairing) }.disabled(session.isBusy)\n                            } else {\n                                Button("Pause") { session.pauseJourney() }\n                            }\n                            Button("Stop and restore real GPS",role:.destructive) { session.stop(pairing:pairing) }\n                        } else {\n                            Button("Start / resume journey") { session.startJourney(pairing:pairing) }.disabled(session.isBusy)\n                        }\n                    }\n                    Section("Itinerary") {\n                        ForEach(plan.legs) { leg in\n                            VStack(alignment:.leading,spacing:4) {\n                                Text(leg.title).font(.headline)\n                                Text("\\(leg.mode.capitalized) · \\(format(leg.start,leg.zone)) – \\(format(leg.end,leg.zone))").font(.caption).foregroundStyle(.secondary)\n                                if let notes = leg.notes { Text(notes).font(.caption).foregroundStyle(.secondary) }\n                            }\n                        }\n                    }\n                }\n                Section("Background & safety") {\n                    Text("The clock continues while paused. When resumed, missed movement may be skipped. Keep the developer tunnel connected. iOS can suspend the app; after force quit, reopen and tap Start / resume. At completion the app attempts to restore real GPS. Never use simulated coordinates for navigation, emergencies or proof of travel.").font(.footnote).foregroundStyle(.secondary)\n                }\n            }\n            .navigationTitle("Journey Autopilot")\n            .navigationBarTitleDisplayMode(.inline)\n            .toolbar { ToolbarItem(placement:.confirmationAction) { Button("Done") { dismiss() } } }\n            .fileImporter(isPresented:$importing,allowedContentTypes:[.json],allowsMultipleSelection:false) { result in\n                do {\n                    guard let url = try result.get().first else { return }\n                    let access = url.startAccessingSecurityScopedResource()\n                    defer { if access { url.stopAccessingSecurityScopedResource() } }\n                    let size = try url.resourceValues(forKeys:[.fileSizeKey]).fileSize ?? 0\n                    guard size <= JourneyPlan.maxBytes else { throw JourneyError.invalid("File exceeds 2 MB.") }\n                    load(try Data(contentsOf:url))\n                } catch { self.error = error.localizedDescription }\n            }\n            .alert("Journey Autopilot",isPresented:Binding(get:{error != nil},set:{if !$0 {error = nil}})) {\n                Button("OK",role:.cancel) {error = nil}\n            } message: { Text(error ?? "") }\n        }\n    }\n    private func load(_ data:Data) { do {try session.importJourney(data)} catch {self.error = error.localizedDescription} }\n    private func format(_ date:Date,_ zone:TimeZone) -> String {\n        let f = DateFormatter(); f.timeZone = zone; f.dateFormat = "MMM d, HH:mm z"; return f.string(from:date)\n    }\n}\n', 'test.swift': 'import Foundation\n@main struct JourneyChecks {\n    static func main() throws {\n        let p = JourneyPoint(latitude:0,longitude:0), q = JourneyPoint(latitude:0.01,longitude:0)\n        let start = Date(timeIntervalSince1970:1000)\n        let a = JourneyLeg(title:"Meal",mode:"stay",start:start,end:start.addingTimeInterval(100),timeZone:"Etc/UTC",notes:nil,points:[p])\n        let b = JourneyLeg(title:"Walk",mode:"walk",start:a.end,end:a.end.addingTimeInterval(200),timeZone:"Etc/UTC",notes:nil,points:[p,q])\n        let c = JourneyLeg(title:"Rest",mode:"stay",start:b.end,end:b.end.addingTimeInterval(300),timeZone:"Etc/UTC",notes:nil,points:[q])\n        let plan = JourneyPlan(version:1,title:"Test",legs:[a,b,c])\n        let schedule = try JourneySchedule(plan)\n        precondition(schedule.frame(at:start.addingTimeInterval(-1)).label == "Waiting for start")\n        precondition(schedule.frame(at:start).label == "Meal")\n        precondition(schedule.frame(at:b.start).label == "Walk")\n        precondition(abs(schedule.frame(at:b.start.addingTimeInterval(100)).point.latitude-0.005)<0.000001)\n        precondition(schedule.frame(at:c.start).label == "Rest")\n        precondition(schedule.frame(at:c.end).finished)\n        let invalid = JourneyPlan(version:1,title:"Invalid",legs:[a,c])\n        do {try invalid.validate(); fatalError("Gap accepted")} catch {}\n        let encoder = JSONEncoder(); encoder.dateEncodingStrategy = .iso8601\n        let decoded = try JourneyPlan.decode(encoder.encode(plan)); precondition(decoded.legs.count == 3)\n        print("Journey schedule checks passed")\n    }\n}\n'}
          sfile = Path('Locus/Engine/SpoofSession.swift')
          rfile = Path('Locus/Features/Map/RootView.swift')
          s = sfile.read_text(); r = rfile.read_text()
          s = replace(s, '    private let favoritesKey = "locus.favorites"', parts['session.txt'] + '    private let favoritesKey = "locus.favorites"')
          s = replace(s, '        favorites = SavedPlace.load(key: favoritesKey)', '        if let data = UserDefaults.standard.data(forKey: JourneyPlan.storageKey) { journeyPlan = try? JourneyPlan.decode(data) }\n        favorites = SavedPlace.load(key: favoritesKey)')
          s = replace(s, '    private func cancelMovement() {\n        stopFreeLiveFlight()', '    private func cancelMovement() {\n        clearJourneyMovement()\n        stopFreeLiveFlight()')
          s = replace(s, '        let noise = variation.update(seconds: dt, settings: motionSettings)', parts['tick.txt'] + '        let noise = variation.update(seconds: dt, settings: motionSettings)')
          s += parts['model.swift']
          r = replace(r, 'import SwiftUI', 'import SwiftUI\nimport UniformTypeIdentifiers\nimport UIKit')
          r = replace(r, '    @State private var showPlaces = false', '    @State private var showPlaces = false\n    @State private var showJourney = false')
          r = replace(r, '                showPlaces: $showPlaces', '                showPlaces: $showPlaces,\n                showJourney: $showJourney')
          r = replace(r, '        .sheet(isPresented: $showPlaces) {', '        .sheet(isPresented: $showJourney) { JourneyAutopilotView() }\n        .sheet(isPresented: $showPlaces) {')
          r = replace(r, '    @Binding var showPlaces: Bool', '    @Binding var showPlaces: Bool\n    @Binding var showJourney: Bool')
          r = replace(r, '            SpeedControls()', '''            Button { showJourney = true } label: {
                          HStack {
                              Image(systemName: "calendar.badge.clock")
                              Text(session.journeyEnabled ? session.journeyActivity : "Journey Autopilot").lineLimit(1)
                              Spacer()
                              Image(systemName: "chevron.right")
                          }.font(.subheadline.weight(.semibold)).padding(10)
                          .background(Color.primary.opacity(0.08), in: RoundedRectangle(cornerRadius:12))
                      }.buttonStyle(.plain)
                      SpeedControls()''')
          r += parts['view.swift']
          sfile.write_text(s); rfile.write_text(r)
          Path('Tests/JourneyChecks.swift').write_text(parts['test.swift'])
          Path('/tmp/locus-journey-model.swift').write_text('import Foundation\n' + parts['model.swift'])

          Path("examples").mkdir(exist_ok=True)
          Path("examples/journey-example.json").write_text('{\n  "version": 1,\n  "title": "Fictional test itinerary \\u2014 replace dates and coordinates",\n  "legs": [\n    {\n      "title": "Breakfast",\n      "mode": "stay",\n      "start": "2027-01-01T07:00:00Z",\n      "end": "2027-01-01T07:30:00Z",\n      "timeZone": "Etc/UTC",\n      "points": [\n        {\n          "latitude": 0,\n          "longitude": 0\n        }\n      ]\n    },\n    {\n      "title": "Test walk",\n      "mode": "walk",\n      "start": "2027-01-01T07:30:00Z",\n      "end": "2027-01-01T07:45:00Z",\n      "timeZone": "Etc/UTC",\n      "points": [\n        {\n          "latitude": 0,\n          "longitude": 0\n        },\n        {\n          "latitude": 0.005,\n          "longitude": 0\n        }\n      ]\n    },\n    {\n      "title": "Rest",\n      "mode": "stay",\n      "start": "2027-01-01T07:45:00Z",\n      "end": "2027-01-01T08:00:00Z",\n      "timeZone": "Etc/UTC",\n      "points": [\n        {\n          "latitude": 0.005,\n          "longitude": 0\n        }\n      ]\n    }\n  ]\n}\n')
          Path("JOURNEY-AUTOPILOT.md").write_text('# Journey Autopilot\n\nThis is scheduled GPS simulation, not proof of actual travel. It does not independently retrieve or book flights. No paid API is required for playback. ChatGPT or another planner supplies itinerary times and route geometry.\n\n## Use\nOpen Journey Autopilot on the map screen. Import or paste the JSON, review and tap Start. Pause holds the last location; the real clock continues. Resume samples the current scheduled location. Imported plans persist across app launches; after force quit reopen and explicitly resume. iOS may suspend background execution or lose the developer tunnel. At the end, Locus attempts to restore real GPS. Do not use simulated location for emergencies or navigation.\n\n## JSON v1\nSee examples/journey-example.json (fictional test coordinates). Each leg contains title, mode, start/end (ISO-8601 whole seconds, UTC recommended), optional IANA timeZone and notes, and an array of points containing latitude and longitude. Modes: stay, walk, run, cycle, drive, flight, ship, train. Stay has one point; moving legs have two or more. Adjacent times must match exactly and coordinates must connect within 1 meter. Limits: 2 MB, 100,000 points, 10,000 activities, 366 days. Movement is interpolated by path distance over the scheduled duration; it is not live aircraft/traffic data. Supply real road geometry or labeled estimated flight paths, not invented confirmed gates or bookings.\n')
          PYTHON_INSTALLER
      - name: Test the scheduling engine
        run: |
          swiftc /tmp/locus-journey-model.swift Tests/JourneyChecks.swift -o /tmp/locus-journey-check
          /tmp/locus-journey-check
      - name: Build and verify unsigned IPA
        run: scripts/build-unsigned-ipa.sh
      - name: Publish upgrade on a separate branch
        run: |
          git switch -c feature/journey-autopilot
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Locus/Engine/SpoofSession.swift Locus/Features/Map/RootView.swift Tests/JourneyChecks.swift JOURNEY-AUTOPILOT.md examples/journey-example.json
          git commit -m 'Add Journey Autopilot itinerary scheduler'
          git push origin HEAD:refs/heads/feature/journey-autopilot
      - name: Upload IPA and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Locus-Journey-Autopilot-${{ github.run_id }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 14
